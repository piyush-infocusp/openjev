# Search space for the OpenJev training-speed Optuna loop (tools/optuna_loop.py).
#
# One entry per idea. Fields:
#   name             param name; bench_trials.py must have code that reads it
#   type             categorical | int | float
#   choices          categorical only
#   low/high/step/log  int and float only
#   default          the baseline value (trial 0 is the baseline, built from these)
#   requires_reload  true = the model must be loaded again to change it (bench_trials
#                    groups trials by these params and loads once per group)
#   implemented      only implemented dimensions are sampled
#   sample           optional, default true. false = implemented, but TPE never draws it:
#                    trials use the default unless `propose --enqueue-json` sets it (profile)
#   idea             short text: why it might be faster, and a reference
#
# New idea = add an entry here + the code in bench_trials.py (and train_prism.py) that
# reads the param. Keep it `implemented: false` until that code exists: bench_trials
# fails any trial that carries a param it has no handler for.
#
# Note: YAML 1.1 reads bare on/off/yes/no as booleans, so quote them.
#
# Compatibility with earlier rounds: never change the choices (or their order) of an
# existing dimension; Optuna rejects a changed categorical space for old trials. Changing
# a default or adding a dimension is fine (old trials just lack the new param). The
# baseline (trial 0) keeps the defaults it was run with.

# Round of the study. Each round gets its own baseline trial (these defaults), and the
# quality guard uses only the current round's baseline. Round 2: OJ-080 changed the Prism
# mask and the defaults changed (ple_cpu 0, dtype fp16), so round 1's baseline is stale.
# Round 3: fixed micro-batch and global batch (Idea 5), fixed trial data, so round 2's
# numbers (one optimizer step per micro-batch of a sampled bs) are not comparable.
# Round 4: baseline ple_cpu=1 (r3small: ple_cpu=0 and chunked_math+ckpt off ran out of memory
# at mb 8; ple_cpu=1 was the only config that fit), so the quality guard has a baseline.
# Round 7 (study openjev-speed-v3): the fixed multi-length bench set replaces the single
# trial stream + pack_len (user decision 2026-11-23); numbers are not comparable with v2.
round: 9

# Optuna study in runs/optuna/study.db. Round 3 starts a NEW study so the dashboard,
# the importances and TPE only see fair trials (fixed micro-batch, global batch, trial
# data, mask and dtype). The legacy study "openjev-speed" (rounds 1-2) stays untouched.
# Round 7 starts openjev-speed-v3 in the same study.db (v2 keeps rounds 3-6 for history).
study_name: openjev-speed-v3

# ---------------------------------------------------------------- study settings (constants)
# Not sampled. propose writes them into every trials.json entry; bench_trials applies them.
# Every timed step is ONE optimizer step of global_batch samples: micro_batch samples per
# forward/backward, grad_accum = global_batch // micro_batch micro-steps, then the step.
# A trial that runs out of memory at micro_batch is PRUNED as infeasible_at_mb<micro_batch>
# (never retried smaller). Change micro_batch here only together with a new round.
global_batch: 32
micro_batch: 8
warmup_steps: 1        # optimizer steps before the quality guard (same for every trial)
timed_steps: 1         # optimizer steps in the timed loop; with bench_set: PER BUCKET (r7: 1, the ~3 min budget)
diag_mb: null          # r3-r6: 16 (baseline only, recorded, never used); not run on the bench set
# v3+: the FIXED multi-length bench set (tools/length_curriculum.py bench --max-state 2048):
# 32 uncut train records per bucket <=128/256/512/1024/2048 + bucket weights (share of training
# steps). Every trial times every bucket; objective = weighted samples/s. Replaces the trial
# stream and the packing / pack_len trial condition (both stay train_prism flags).
bench_set: runs/optuna/bench_lengths.json
# Frozen data (tools/optuna_loop.py freeze): the same record ids for every trial.
trial_stream_len: 640  # >= (warmup_steps + timed_steps) * global_batch, with margin
probe_n: 8             # fixed probe set for the quality guard (one per source, then round robin)
# Quality checkpoints (tools/optuna_loop.py validate-plan, PROFILE=optuna_validate).
validate_every: 30     # completed trials since the last checkpoint
validate_steps: 150    # optimizer steps of real training per config (best and baseline)
val_per_source: 50     # frozen val set: records per source, stratified by question type
                       # and option-count bucket

dimensions:
  - name: bs
    type: categorical
    choices: [1, 2, 4, 8]
    default: 4
    requires_reload: false
    implemented: true
    sample: false   # r3: replaced by the fixed micro_batch / global_batch settings (Idea 5)
    idea: >-
      Micro-batch size (rounds 1-2 only). It changed the samples per optimizer step, so it
      confounded speed with optimization (gradient noise, lr) and the quality guard. From
      round 3 bench ignores it when micro_batch is set. Old trials keep it as a param.

  - name: grad_ckpt
    type: categorical
    choices: ["on", "off"]
    default: "on"
    requires_reload: false
    implemented: true
    idea: >-
      OJ-073. Checkpointing costs ~33% recompute; E2B uses ~7 of 15 GB, so off may fit.
      Chen et al. 2016, arXiv:1604.06174.

  - name: max_state_tokens
    type: categorical
    choices: [512, 768, 1024]
    default: 1024
    requires_reload: false
    implemented: true
    idea: >-
      Shorter state truncation = fewer tokens per sample. Trades quality for speed
      (helpsteer3 is cut more), so compare tokens/s too.
    sample: false   # r4: fixed at the default (1024); changing it alters quality, like bs did

  - name: torch_threads
    type: categorical
    choices: [1, 2, 4]
    default: 4
    requires_reload: false
    implemented: true
    idea: >-
      OJ-076. torch.set_num_threads for the CPU side (PLE lookup on CPU, collate).
      Kaggle has ~4 cores. PyTorch tuning guide.

  - name: sdpa_backend
    type: categorical
    choices: [default, efficient, math]
    default: default
    requires_reload: false
    implemented: true
    idea: >-
      OJ-074. Force the SDPA kernel with torch.nn.attention.sdpa_kernel. Flash cannot take a
      float mask; mem-efficient can (head_dim limits on T4). PyTorch SDPA docs.

  - name: ple_cpu
    type: categorical
    choices: [1, 0]
    default: 1      # r4: 0 does not fit at mb 8 on a T4 (r3small trial 13 OOM)
    requires_reload: true
    implemented: true
    idea: >-
      Per-Layer Embedding table on CPU (saves 4.7 GB on E2B) vs on GPU (no host->device copy
      per batch). Gemma 4 config; train_prism.place(). Round 1: 0 was +23% samples/s, so it
      is the default from round 2 (the round-1 baseline trial 0 ran with 1).
    sample: false   # r1: ple_cpu=0 was +23%; fixed to avoid a reload group

  - name: dtype
    type: categorical
    choices: [fp16, bf16_emulated, fp32]
    default: fp16
    requires_reload: true
    implemented: true
    idea: >-
      OJ-081. Base weight dtype. --dtype auto picked bf16 on T4 because
      torch.cuda.is_bf16_supported() counts emulated bf16 (sm75 has no native bf16), so
      round 1 likely ran EMULATED bf16. fp16 (+ GradScaler, skipped steps recorded) is the
      round-2 default; bf16_emulated reproduces round 1; fp32 for reference.
      PyTorch AMP docs.
    sample: false   # r2: TPE drew fp32 (does not fit a T4); bf16_emulated only via --enqueue-json

  - name: attn_backend
    type: categorical
    choices: [sdpa_default, sdpa_bool, chunked_math, flex]
    default: sdpa_default
    requires_reload: false
    implemented: true
    idea: >-
      Round 2. Attention backend, swapped at runtime (openjev/attn_backends.py). sdpa_bool:
      boolean mask instead of the additive float mask (half the mask memory; maybe another
      SDPA kernel). chunked_math: math attention over 256-query chunks, each checkpointed,
      so attention memory is O(chunk*T), not O(T^2) (may allow grad_ckpt off). flex:
      FlexAttention with a BlockMask from the Prism mask (Dong et al. 2024,
      arXiv:2412.05496); "unsupported" if Triton cannot build it on T4. SDPA docs.
      r3small: flex REJECTED on T4 (Triton kernel needs 65536 B shared memory, the T4
      hardware limit); do not enqueue it on T4.

  - name: profile
    type: categorical
    choices: [0, 1]
    default: 0
    requires_reload: false
    implemented: true
    sample: false
    idea: >-
      Round 2. 1 = after the timed loop, run torch.profiler (CPU + CUDA) over 2 more steps
      and store the top-25 ops by self CUDA / CPU time and the share of attention, matmul,
      masks, PLE lookup, copies and collate. Objective is still samples/s. Set only with
      `propose --enqueue-json`. PyTorch profiler recipe.

  - name: option_subsample_k
    type: int
    low: 0
    high: 24
    step: 4
    default: 0
    requires_reload: false
    implemented: true
    sample: false
    idea: >-
      OJ-072. Train on the gold option + k random negatives per choice question (0 = all
      options); eval and the probe always use all options. clinc150 and banking77 templates
      shrink from ~1000 to ~200 tokens. Never sampled before r4, so int (was a planned
      categorical) is safe. train_prism --option-subsample-k. Mikolov et al. 2013, arXiv:1310.4546.

  - name: packing
    type: categorical
    choices: ["off", "on"]
    default: "on"
    requires_reload: false
    implemented: true
    sample: false   # frozen data condition (user decision 2026-11-20): packing is exact, so it is a data layout
    idea: >-
      OJ-060. Hierarchical packing of each micro-batch (source mix -> length bucket ->
      first-fit-decreasing rows <= pack_len) with a doc-id block-diagonal mask, positions
      restart per request (packed flag logits == unpacked, tests/test_packing.py). Same
      records per micro-batch, fewer padded tokens. train_prism --packing.
      Krell et al. 2021, arXiv:2107.02027.

  - name: pack_len
    type: categorical
    choices: [1024, 2048]
    default: 1024   # r5 measured 1024 best
    requires_reload: false
    implemented: true
    sample: false   # frozen with packing: runs/optuna/packed_layout.json (tools/freeze_packed.py)
    idea: >-
      OJ-060. Row length for packing (used only when packing is on; a longer request gets a
      row of its own). train_prism --pack-len.

  - name: quant
    type: categorical
    # 8bit -> int8 before it was ever implemented or enqueued, so no trial carries the old choice.
    choices: ["none", "int8", "nf4"]
    default: "none"
    requires_reload: true
    implemented: true
    sample: false
    idea: >-
      OJ-075. bitsandbytes int8 (LLM.int8(), threshold 6.0) or nf4 (QLoRA 4-bit, no double
      quant, fp16 compute) for the LoRA-target projections of the decoder layers; LoRA, flag
      head, embeddings and the PLE table stay unquantized. Frees ~1.7 (int8) or ~2.5 GB (nf4), so
      grad_ckpt off may fit at mb 8 (no recompute), but dequantization costs time. Enqueue
      only. train_prism --quant. Dettmers et al. 2023, arXiv:2305.14314; 2022, arXiv:2208.07339.

  - name: length_stage
    type: categorical
    choices: [0, 128, 256, 512, 1024, 2048]
    default: 0
    requires_reload: false
    implemented: true
    sample: false
    idea: >-
      Length curriculum (user idea). 0 = off (the normal trial stream). N = time the frozen
      stage-N stream (bench_trials --stage-streams, tools/length_curriculum.py freeze): records
      whose encoded length is in that bucket, never cut. Overrides packing/pack_len with
      stage_pack_mult. Stage trials are NOT comparable with the main study (shorter records are
      faster): run them in their own study (propose --study openjev-length-v1) and compare
      only within a stage. train_prism --length-curriculum. Li et al. 2022, arXiv:2108.06084.

  - name: stage_pack_mult
    type: categorical
    choices: [0, 1, 2]
    default: 1
    requires_reload: false
    implemented: true
    sample: false
    idea: >-
      Length curriculum, only with length_stage > 0: pack_len = stage_pack_mult x stage max.
      0 = unpacked, length-bucketed micro-batches padded to their longest request (no
      cross-request attention blocks; T4 has no varlen kernel). train_prism
      --curriculum-pack-mult (0 = --packing off).

  - name: ddp
    type: categorical
    choices: ["off", "on"]
    default: "off"
    requires_reload: true
    implemented: true
    sample: false
    idea: >-
      OJ-062. Data parallel over every GPU (2xT4): bench_trials hands ddp=on trials to one
      torchrun launch; each rank runs a token-balanced share of the same global batch (same
      records as a 1-GPU trial), so samples/s compares directly. Enqueue only.
      Li et al. 2020, arXiv:2006.15704.

  - name: sync_mode
    type: categorical
    choices: [ddp, local_sgd]
    default: ddp
    requires_reload: false
    implemented: true
    sample: false
    idea: >-
      OJ-062, ddp=on only. ddp: one gradient all-reduce per optimizer step (no_sync on the
      other micro-steps). local_sgd: no gradient all-reduce, each GPU steps its own AdamW and
      the LoRA / flag-head weights are averaged every sync_every steps (and before each probe).
      Lin et al. 2020 (ICLR), arXiv:1808.07217; Stich 2019, arXiv:1805.09767.

  - name: sync_every
    type: categorical
    choices: [1, 10, 50, 200]
    default: 50
    requires_reload: false
    implemented: true
    sample: false
    idea: >-
      OJ-062, sync_mode=local_sgd only: optimizer steps between weight averages (K).

  # ------------------------------------------------------------ planned (not sampled yet)

  - name: fp16_compress_hook
    type: categorical
    choices: ["off", "on"]
    default: "off"
    requires_reload: true
    implemented: false
    idea: >-
      OJ-078d. Halves the PCIe gradient traffic (small for 24M LoRA params). DDP comm hooks docs.

  - name: bucket_cap_mb
    type: categorical
    choices: [25, 50]
    default: 25
    requires_reload: true
    implemented: false
    idea: OJ-078b. DDP gradient bucket size; set at DDP wrap time. DDP docs.


  # choices were ["off", "on"] while unimplemented; never sampled or enqueued, so no trial
  # carries the old space (like quant 8bit -> int8).
  - name: torch_compile
    type: categorical
    choices: ["off", "default", "reduce-overhead"]
    default: "off"
    requires_reload: false
    implemented: true
    sample: false   # enqueue only (r8: off vs default vs reduce-overhead on the best r7 config)
    idea: >-
      OJ-079. torch.compile of the decoder layers only (openjev/compile.py: per-layer
      nn.Module.compile, dynamic=True, recompile limit 64, a hit = unsupported). PLE (CPU),
      Prism masks, flag head, loss, GradScaler, DDP stay eager; HF grad checkpointing wraps
      the compiled call; LoRA (PEFT) inside. default = Inductor kernel fusion (T4 profile: mul
      15%, copy_ 12.5% are fusable); reduce-overhead = + CUDA graphs (one recording per
      shape). Bench records compile_s / compile_graphs / compile_recompiles apart from the
      timed numbers (pre-pass before loss_start). Inductor/Triton failures (T4 64 KB smem:
      flex failed with "No valid triton configs") = unsupported. Ansel et al. 2024 (PyTorch 2),
      ASPLOS: https://pytorch.org/assets/pytorch2-2.pdf

  - name: dataloader_workers
    type: categorical
    choices: [0, 1, 2]
    default: 0
    requires_reload: false
    implemented: false
    idea: >-
      OJ-076. Tokenize and collate in DataLoader workers with pin_memory and non_blocking
      copies. PyTorch data loading docs.
